<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#092c28"><link rel="manifest" href="poker.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml">
<title>德州小桌</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071d1c;color:#f5f1e7;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}.app{max-width:520px;margin:auto;min-height:100vh;padding:16px 16px 26px;background:radial-gradient(ellipse at 50% 45%,#155849 0,#0d4037 35%,#092c28 78%);display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;font-size:18px;letter-spacing:1px}.brand i{font-style:normal;color:#e6bb68}.icon{background:#ffffff14;border:1px solid #ffffff22;color:#fff;border-radius:50%;width:36px;height:36px;font-size:18px}.stats{display:flex;gap:8px;margin:14px 0}.stat{flex:1;border:1px solid #ffffff1c;border-radius:12px;background:#061e1b80;padding:8px 11px}.stat small{display:block;color:#a7c1b7;font-size:11px}.stat b{font-size:16px}.table{position:relative;border:2px solid #c19a5050;border-radius:46%/35%;height:430px;min-height:390px;background:radial-gradient(ellipse,#17745b,#10513f 64%,#103c33);box-shadow:inset 0 0 0 7px #082c25,0 15px 35px #0005;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 10px}.seat{position:absolute;text-align:center;min-width:108px}.seat.topseat{top:15px}.seat.left{left:0;top:46%}.seat.right{right:0;top:46%}.seat.bottom{bottom:7px}.name{font-size:12px;color:#d9e7dd}.stack{font-weight:700;font-size:14px}.badge{background:#09251fbd;border:1px solid #ffffff22;border-radius:12px;padding:3px 9px;display:inline-block;margin-top:3px;font-size:11px;min-height:22px}.dealer{color:#18231c;background:#f1d897;border-radius:50%;width:20px;height:20px;display:inline-grid;place-items:center;font-size:10px;font-weight:800;margin-left:4px}.cards{display:flex;justify-content:center;gap:6px;margin-top:5px;min-height:54px}.card{width:38px;height:53px;border-radius:6px;background:#fffdf8;color:#202520;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;box-shadow:0 2px 5px #0005;font-size:19px;line-height:1}.card small{font-size:13px}.red{color:#ca3b43}.back{background:repeating-linear-gradient(45deg,#d9cfae,#d9cfae 3px,#234f48 3px,#234f48 6px);border:2px solid #f6ecd4}.board{display:flex;gap:5px;min-height:66px;align-items:center}.board .card{width:42px;height:60px}.pot{margin:6px 0 11px;color:#f3d58c;font-weight:700;text-align:center;font-size:13px}.status{font-size:12px;color:#c5d8ca;text-align:center;min-height:19px;margin:7px 0 10px}.actions{margin-top:auto}.actionrow{display:flex;gap:9px}.actionrow button,.newhand{border:0;border-radius:12px;padding:14px 9px;font-weight:750;font-size:15px;flex:1;color:#122620;background:#efc66f;box-shadow:0 3px 0 #a87831}.actionrow button.secondary{background:#ecede6}.actionrow button.danger{background:#dca5a0}.actionrow button:disabled{opacity:.45;box-shadow:none}.raisebar{display:flex;align-items:center;gap:10px;margin:11px 0;color:#c7d9ce;font-size:12px}.raisebar input{flex:1;accent-color:#efc66f}.foot{text-align:center;color:#829e94;font-size:10px;margin-top:16px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:22px}.modal>div{background:#10382f;border:1px solid #ffffff2a;border-radius:18px;padding:20px;max-width:380px;color:#eaf1e9}.modal h2{margin:0 0 10px;color:#f3d58c}.modal p{font-size:14px;color:#cfddd4}.modal button{background:#efc66f;border:0;border-radius:9px;padding:10px 18px;font-weight:700}
@media(max-height:740px){.table{height:390px;min-height:360px}.stats{margin:9px 0}.card{width:34px;height:48px}.board .card{width:38px;height:54px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><i>♠</i> 德州小桌</div><button class="icon" id="help" aria-label="玩法">?</button></header><div class="stats"><div class="stat"><small>你的筹码</small><b id="chips">1,000</b></div><div class="stat"><small>盲注</small><b>10 / 20</b></div><div class="stat"><small>当前牌局</small><b id="handno">第 1 局</b></div></div><section class="table"><div class="seat topseat" id="seat1"></div><div class="seat left" id="seat2"></div><div class="seat right" id="seat3"></div><div class="board" id="board"></div><div class="pot" id="pot">底池 0</div><div class="seat bottom" id="hero"></div></section><div class="status" id="status"></div><section class="actions"><div class="actionrow"><button class="danger" id="fold">弃牌</button><button class="secondary" id="call">跟注</button><button id="raise">加注</button></div><div class="raisebar"><span>加注到 <b id="raiseval">60</b></span><input id="slider" type="range" min="40" max="500" step="20" value="60"><span id="maxval">1,000</span></div><div class="actionrow" id="nextrow" style="display:none"><button class="newhand" id="next">开始下一局</button></div></section><div class="foot">仅供娱乐 · 虚拟筹码 · 不涉及真钱</div></main><div class="modal" id="modal"><div><h2>玩法说明</h2><p>你和三位电脑玩家进行德州扑克。每人发两张底牌，桌面依次翻出公共牌。用两张手牌和五张公共牌组成最强的五张牌，赢得底池。</p><p>每一轮可弃牌、跟注或加注。电脑玩家会根据手牌作出简单决策。筹码归零后可以重新开始。</p><button id="close">知道了</button></div></div>
<script>
const suits=['♠','♥','♦','♣'], ranks='23456789TJQKA';let players,board,pot,street,toCall,handNo=0,active=false,button=0,deck;
const $=id=>document.getElementById(id), fmt=n=>Math.max(0,Math.floor(n)).toLocaleString('zh-CN');
function freshDeck(){deck=[];for(let s=0;s<4;s++)for(let r=0;r<13;r++)deck.push({s,r,v:r+2});for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}
function card(c,hidden=false){if(!c)return '<div class="card" style="opacity:0"></div>';if(hidden)return '<div class="card back"></div>';let sym=suits[c.s],rank=ranks[c.r]==='T'?'10':ranks[c.r]==='J'?'J':ranks[c.r]==='Q'?'Q':ranks[c.r]==='K'?'K':ranks[c.r]==='A'?'A':ranks[c.r];return `<div class="card ${c.s===1||c.s===2?'red':''}">${rank}<small>${sym}</small></div>`}
function init(){players=[{name:'你',chips:1000,hand:[],fold:false,bet:0},{name:'小麦',chips:1000,hand:[],fold:false,bet:0},{name:'阿杰',chips:1000,hand:[],fold:false,bet:0},{name:'林',chips:1000,hand:[],fold:false,bet:0}];start()}
function start(){if(players[0].chips<=0){players[0].chips=1000;players.slice(1).forEach(p=>p.chips=1000)}handNo++;freshDeck();board=[];pot=0;street=0;toCall=20;players.forEach(p=>{p.hand=[deck.pop(),deck.pop()];p.fold=false;p.bet=0});let sb=(button+1)%4,bb=(button+2)%4;pay(players[sb],10);pay(players[bb],20);render();$('status').textContent='你的回合 · 盲注 10 / 20';active=true;controls(true)}
function pay(p,n){n=Math.min(n,p.chips);p.chips-=n;p.bet+=n;pot+=n}
function rank5(cards){let vals=cards.map(c=>c.v).sort((a,b)=>b-a),counts={};vals.forEach(v=>counts[v]=(counts[v]||0)+1);let groups=Object.entries(counts).map(([v,n])=>[+v,n]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);let flush=cards.every(c=>c.s===cards[0].s),u=[...new Set(vals)],straight=0;for(let i=0;i<=u.length-5;i++)if(u[i]-u[i+4]===4){straight=u[i];break}if(!straight&&[14,5,4,3,2].every(v=>vals.includes(v)))straight=5;let cat,k;if(flush&&straight){cat=8;k=[straight]}else if(groups[0][1]===4){cat=7;k=[groups[0][0],groups[1][0]]}else if(groups[0][1]===3&&groups[1][1]===2){cat=6;k=[groups[0][0],groups[1][0]]}else if(flush){cat=5;k=vals}else if(straight){cat=4;k=[straight]}else if(groups[0][1]===3){cat=3;k=[groups[0][0],...groups.slice(1).map(g=>g[0]).sort((a,b)=>b-a)]}else if(groups[0][1]===2&&groups[1][1]===2){cat=2;k=[groups[0][0],groups[1][0],groups[2][0]]}else if(groups[0][1]===2){cat=1;k=[groups[0][0],...groups.slice(1).map(g=>g[0]).sort((a,b)=>b-a)]}else{cat=0;k=vals}return [cat,...k]}
function best7(cs){let best=null;for(let a=0;a<cs.length-4;a++)for(let b=a+1;b<cs.length-3;b++)for(let c=b+1;c<cs.length-2;c++)for(let d=c+1;d<cs.length-1;d++)for(let e=d+1;e<cs.length;e++){let r=rank5([cs[a],cs[b],cs[c],cs[d],cs[e]]);if(!best||cmp(r,best)>0)best=r}return best}
function cmp(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){let d=(a[i]||0)-(b[i]||0);if(d)return d}return 0}
function label(r){return ['高牌','一对','两对','三条','顺子','同花','葫芦','四条','同花顺'][r[0]]}
function controls(on){['fold','call','raise','slider'].forEach(id=>$(id).disabled=!on);$('nextrow').style.display=on?'none':'flex';}
function render(){ $('chips').textContent=fmt(players[0].chips);$('handno').textContent=`第 ${handNo} 局`;$('pot').textContent=`底池 ${fmt(pot)}`;$('board').innerHTML=Array.from({length:5},(_,i)=>card(board[i])).join('');let ids=['hero','seat1','seat2','seat3'];ids.forEach((id,j)=>{let pi=j===0?0:j;let p=players[pi],show=j===0||!active&& !p.fold;let dealer=pi===button?'<span class="dealer">D</span>':'';let badges=p.fold?'已弃牌':(j===0?'你的手牌':p.chips===0?'全下':'思考中');$(id).innerHTML=`<div class="name">${p.name} ${dealer}</div><div class="stack">${fmt(p.chips)}</div><div class="badge">${badges}</div><div class="cards">${p.hand.map(c=>card(c,!show)).join('')}</div>`});$('slider').max=Math.max(40,players[0].chips+players[0].bet);$('maxval').textContent=fmt(players[0].chips);let val=Math.min(+$('slider').value,+$('slider').max);$('raiseval').textContent=fmt(val);$('call').textContent=toCall>players[0].bet?`跟注 ${fmt(Math.min(toCall-players[0].bet,players[0].chips))}`:'过牌'}
function aiAct(p){if(p.fold||p.chips<=0)return;let strength=best7([...p.hand,...board]);let score=strength?strength[0]:0;let chance=.18+score*.09+Math.random()*.20;if(chance<.29&&toCall>p.bet+20&&street<3){p.fold=true;return}if(toCall>p.bet)pay(p,toCall-p.bet)}
function act(type){if(!active)return;let p=players[0];if(type==='fold'){p.fold=true;for(let i=1;i<4;i++)aiAct(players[(i+button)%4]);while(street<3){street++;let n=street===1?3:1;for(let j=0;j<n;j++)board.push(deck.pop());players.forEach(x=>x.bet=0)}showdown();return}if(type==='call'&&toCall>p.bet)pay(p,toCall-p.bet);if(type==='raise'){let target=Math.max(toCall+20,+$('slider').value);pay(p,Math.min(p.chips,target-p.bet));toCall=p.bet}for(let i=1;i<4;i++)aiAct(players[(i+button)%4]);if(players.slice(1).every(p=>p.fold)){players[0].chips+=pot;finish('其他玩家都弃牌，你赢得底池');return}advance()}
function advance(){let still=players.filter(p=>!p.fold);if(still.length===1){still[0].chips+=pot;finish(`${still[0].name} 赢得底池`);return}if(street<3){street++;players.forEach(p=>p.bet=0);toCall=0;let n=street===1?3:1;for(let i=0;i<n;i++)board.push(deck.pop());if(street===3){$('status').textContent='河牌 · 你的回合';}else $('status').textContent=['','翻牌 · 你的回合','转牌 · 你的回合','河牌 · 你的回合'][street];render();return}showdown()}
function showdown(){let eligible=players.filter(p=>!p.fold),best=null,winners=[];eligible.forEach(p=>{let r=best7([...p.hand,...board]);if(!best||cmp(r,best)>0){best=r;winners=[p]}else if(cmp(r,best)===0)winners.push(p)});let share=Math.floor(pot/winners.length);winners.forEach(p=>p.chips+=share);finish(`${winners.map(p=>p.name).join('、')} 获胜 · ${label(best)} · 每人 +${fmt(share)}`)}
function finish(msg){active=false;controls(false);$('status').textContent=msg;render();button=(button+1)%4}
$('fold').onclick=()=>act('fold');$('call').onclick=()=>act('call');$('raise').onclick=()=>act('raise');$('slider').oninput=render;$('next').onclick=start;$('help').onclick=()=>$('modal').style.display='flex';$('close').onclick=()=>$('modal').style.display='none';$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').style.display='none'};init();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
